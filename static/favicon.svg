<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#272c38" stroke-width="4"/>

  <!-- Stylized Guitar Pick / Silhouette -->
  <path d="M 256,90 C 340,90 400,160 380,270 C 360,380 280,430 256,440 C 232,430 152,380 132,270 C 112,160 172,90 256,90 Z" 
        fill="#1e222b" stroke="#384052" stroke-width="6"/>

  <!-- Pick Inner Accent Glow -->
  <path d="M 256,120 C 320,120 365,175 350,265 C 335,355 275,395 256,405 C 237,395 177,355 162,265 C 147,175 192,120 256,120 Z" 
        fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.9" filter="url(#glow)"/>

  <!-- Strings and Soundhole / Bridge Graphic -->
  <circle cx="256" cy="240" r="42" fill="#0f1115" stroke="#384052" stroke-width="4"/>
  <circle cx="256" cy="240" r="16" fill="url(#accentGrad)"/>

  <!-- 6 Strings -->
  <line x1="231" y1="130" x2="231" y2="380" stroke="#f0f3f6" stroke-width="2.5" opacity="0.8"/>
  <line x1="241" y1="125" x2="241" y2="385" stroke="#f0f3f6" stroke-width="2.2" opacity="0.8"/>
  <line x1="251" y1="120" x2="251" y2="390" stroke="#f0f3f6" stroke-width="2.0" opacity="0.8"/>
  <line x1="261" y1="120" x2="261" y2="390" stroke="#f0f3f6" stroke-width="1.8" opacity="0.8"/>
  <line x1="271" y1="125" x2="271" y2="385" stroke="#f0f3f6" stroke-width="1.5" opacity="0.8"/>
  <line x1="281" y1="130" x2="281" y2="380" stroke="#f0f3f6" stroke-width="1.2" opacity="0.8"/>
</svg>
